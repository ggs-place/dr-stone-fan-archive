<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Dr. Stone Fan Archive</title>
  <style>
    :root {
      --bg: #071014;
      --cyan: #72f5ed;
      --green: #b8ff64;
      --muted: #9daea9;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px;
      color: white;
      background:
        radial-gradient(circle at center, rgba(114, 245, 237, 0.14), transparent 40%),
        var(--bg);
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .box {
      max-width: 550px;
    }

    h1 {
      margin: 0;
      color: var(--green);
      font-size: clamp(4rem, 14vw, 9rem);
    }

    h2 {
      color: var(--cyan);
      text-transform: uppercase;
    }

    p {
      color: var(--muted);
      line-height: 1.7;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 20px;
      color: #071014;
      background: var(--green);
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="box">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>
      This page has not been discovered yet by the Kingdom of Science.
    </p>
    <a href="./index.html">Return to the Archive</a>
  </main>
</body>
</html>
